[project]
name = "adaptive-platform-yolo-model"
version = "0.1.0"
description = "YOLO implementation of the model-container API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pillow>=10,<13",
    "python-multipart>=0.0.9,<1.0",
    "ultralytics>=8.3,<9.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
